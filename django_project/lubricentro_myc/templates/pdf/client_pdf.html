<html>

<head>
    <title>Listado de Clientes</title>
    <style type="text/css">
        body {
            font-size: 12px;
            font-family: Arial, sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table td,
        table th {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: left;
        }

        table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-info {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="header-info">
        <h1>Listado de clientes ({% now "d/m/Y" %})</h1>
    </div>

    <table>
        <!--
        <thead>
            <tr>
                <th style="width: 33.33%">Nombre</th>
                <th style="width: 33.33%">Nombre</th>
                <th style="width: 33.33%">Nombre</th>
            </tr>
        </thead>
        -->
        <tbody>
            {% for row in client_rows %}
            <tr>
                {% for client in row %}
                <td>
                    {% if client %}{{ client.nombre|title }}{% endif %}
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
